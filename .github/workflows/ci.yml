name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest unfiltered
        run: python -m pytest tests/

      - name: Enforce Shopify provider coverage
        run: python -m pytest tests/ --cov=el.shopify --cov-report=term-missing --cov-fail-under=85

      - name: Enforce Shopify theme upload coverage
        run: python -m pytest tests/ --cov=el.nodes.upload_shopify_theme --cov-report=term-missing --cov-fail-under=85
